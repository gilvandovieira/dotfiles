general {
    hide_cursor = true
}

background {
    monitor =
    path = /usr/share/wallpapers/cachyos-wallpapers/CachyOS_GreenSpace.png
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 320, 54
    position = 0, -70
    halign = center
    valign = center
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.18
    outer_color = rgb(8ff0a4)
    inner_color = rgba(101418cc)
    font_color = rgb(e8f2ef)
    fade_on_empty = false
    placeholder_text = Senha
    check_color = rgb(f0c674)
    fail_color = rgb(ff6b6b)
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    position = 0, 80
    halign = center
    valign = center
    color = rgb(e8f2ef)
    font_size = 72
    font_family = sans
}

label {
    monitor =
    text = Digite a senha para desbloquear
    position = 0, 10
    halign = center
    valign = center
    color = rgb(b8c7c2)
    font_size = 16
    font_family = sans
}
