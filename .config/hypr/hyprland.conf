# Hyprland config based on ~/.config/niri/cfg.
# Uses hyprscrolling when the plugin is installed for a Niri-like scrolling-column layout.

$mod = SUPER
$terminal = ghostty
$browser = helium-browser
$fileManager = dolphin

monitor = HDMI-A-1, 2560x1440@143.912, 0x0, 1
monitor = eDP-1, 1920x1080@144.003, 2560x0, 1
# Niri had eDP-1 disabled in cfg/display.kdl. Uncomment this if you want the laptop panel off in Hyprland too.
# monitor = eDP-1, disable

workspace = 2, monitor:HDMI-A-1

env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = _JAVA_AWT_WM_NONREPARENTING,1
env = SDL_VIDEODRIVER,wayland,x11
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = DESKTOP_SESSION,Hyprland
env = XCURSOR_THEME,WhiteSur-cursors
env = HYPRCURSOR_THEME,
env = XCURSOR_SIZE,36

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE DESKTOP_SESSION QT_QPA_PLATFORM QT_QPA_PLATFORMTHEME GTK_THEME XCURSOR_THEME XCURSOR_SIZE
exec-once = sh -c 'command -v xrandr >/dev/null 2>&1 && xrandr --output HDMI-A-1 --primary'
exec-once = hyprpaper
exec-once = mako
exec-once = qs -c noctalia-shell

input {
    kb_layout = br
    kb_variant = abnt2
    numlock_by_default = true
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

device {
    name = pointer
    accel_profile = flat
    sensitivity = 0
}

general {
    # gaps_in = 4
    gaps_out = 4
    border_size = 4
    col.active_border = rgb(8ff0a4)
    col.inactive_border = rgb(303030)
    layout = scrolling
    allow_tearing = true
    resize_on_border = true
}

decoration {
    rounding = 3

    shadow {
        enabled = true
    }
}

animations {
    enabled = true
    bezier = niriEaseOutQuad, 0.25, 0.46, 0.45, 0.94
    bezier = niriEaseOutCubic, 0.215, 0.61, 0.355, 1
    animation = windowsIn, 1, 2, niriEaseOutQuad
    animation = windowsOut, 1, 2, niriEaseOutCubic
    animation = windowsMove, 1, 4, niriEaseOutQuad
    animation = workspaces, 1, 3, niriEaseOutQuad
    animation = border, 1, 4, niriEaseOutQuad
    animation = fade, 1, 3, niriEaseOutQuad
}

plugin {
    hyprscrolling {
        column_width = 0.5
        fullscreen_on_one_column = false
        explicit_column_widths = 0.33333, 0.5, 0.66667, 1.0
        focus_fit_method = 1
        follow_focus = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    vrr = 1
}

xwayland {
    force_zero_scaling = true
}

# Applications
bind = $mod, RETURN, exec, $terminal
bind = $mod, SPACE, exec, fuzzel
bind = $mod, B, exec, $browser
bind = $mod ALT, L, exec, hyprlock
bind = $mod SHIFT, Q, exit
bind = $mod, E, exec, $fileManager
bind = $mod, F1, exec, nirimod

# Media
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Focus and movement
bind = $mod, Q, killactive
bind = $mod, LEFT, layoutmsg, focus l
bind = $mod, RIGHT, layoutmsg, focus r
bind = $mod, UP, movefocus, u
bind = $mod, DOWN, movefocus, d
bind = $mod CTRL, LEFT, layoutmsg, movewindowto l
bind = $mod CTRL, RIGHT, layoutmsg, movewindowto r
bind = $mod CTRL, UP, layoutmsg, movewindowto u
bind = $mod CTRL, DOWN, layoutmsg, movewindowto d
bind = $mod, HOME, layoutmsg, fit tobeg
bind = $mod, END, layoutmsg, fit toend
bind = $mod SHIFT, LEFT, focusmonitor, l
bind = $mod SHIFT, RIGHT, focusmonitor, r
bind = $mod SHIFT, UP, focusmonitor, u
bind = $mod SHIFT, DOWN, focusmonitor, d
bind = $mod SHIFT CTRL, LEFT, movewindow, mon:l
bind = $mod SHIFT CTRL, RIGHT, movewindow, mon:r
bind = $mod SHIFT CTRL, UP, movewindow, mon:u
bind = $mod SHIFT CTRL, DOWN, movewindow, mon:d
bind = $mod SHIFT, G, movewindow, mon:HDMI-A-1

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod CTRL, 1, movetoworkspace, 1
bind = $mod CTRL, 2, movetoworkspace, 2
bind = $mod CTRL, 3, movetoworkspace, 3
bind = $mod CTRL, 4, movetoworkspace, 4
bind = $mod CTRL, 5, movetoworkspace, 5
bind = $mod CTRL, 6, movetoworkspace, 6
bind = $mod CTRL, 7, movetoworkspace, 7
bind = $mod CTRL, 8, movetoworkspace, 8
bind = $mod CTRL, 9, movetoworkspace, 9
bind = $mod, TAB, workspace, previous
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bind = $mod CTRL, mouse_down, layoutmsg, movecoltoworkspace e+1
bind = $mod CTRL, mouse_up, layoutmsg, movecoltoworkspace e-1

# Layout controls
bind = $mod, MINUS, layoutmsg, colresize -0.1
bind = $mod, EQUAL, layoutmsg, colresize +0.1
bind = $mod SHIFT, MINUS, resizeactive, 0 -80
bind = $mod SHIFT, EQUAL, resizeactive, 0 80
bind = $mod, T, togglefloating
bind = $mod, F, fullscreen, 1
bind = $mod, O, togglespecialworkspace, overview
bind = CTRL ALT, R, exec, hyprctl reload
bind = CTRL ALT, DELETE, exit

# Screenshots
bind = $mod SHIFT, D, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" -t ppm - | satty --filename - --fullscreen --copy-command wl-copy --output-filename "$HOME/Pictures/Screenshots/screenshot-$(date '+%Y%m%d-%H%M%S').png"
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Mouse window controls
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Window rules.
windowrule = tag +game, match:class ^(gw2-64.exe)$
windowrule = workspace 2 silent, match:class ^(gw2-64.exe)$
windowrule = monitor HDMI-A-1, match:class ^(gw2-64.exe)$
windowrule = fullscreen true, match:class ^(gw2-64.exe)$
windowrule = monitor HDMI-A-1, match:class ^(com.heroicgameslauncher.hgl)$
windowrule = float true, match:class ^(steam)$, match:title negative:^(Steam)$
windowrule = no_focus true, match:class ^(steam)$, match:title ^(notificationtoasts_[0-9]+_desktop)$
